[package]
name = "interpolate2D"
version = "0.1.0"
edition = "2021"

[lib]
path = "./src/interpolate2D.rs"
crate-type = ["cdylib"]

[profile.release]
debug = true

[dependencies]
wasm-bindgen = "0.2.92"
ndarray = "0.15.3"
naturalneighbor = "1.2.2"
js-sys = "0.3.69"
serde_json = "1.0.114"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"
contour = "0.12.1"
fmt = "0.1.0"
geojson = "0.24.1"
web-sys = "0.3.69"
console_error_panic_hook = "0.1.7"
rbf-interp = "0.1.3"
nalgebra = "^0.18"
uuid = { version = "1.8.0", features = ["v4", "js"] }
geo-types = "0.7.13"
